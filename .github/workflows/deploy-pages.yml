name: Deploy forest-racing game to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/3d-forest-racing-game-yi4m45
    paths:
      - 'forest-racing/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish forest-racing/ to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./forest-racing
          publish_branch: gh-pages
          force_orphan: true

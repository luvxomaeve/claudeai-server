<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Waifu Touch</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.1.0/lib/three-vrm.module.js",
        "@pixiv/three-vrm-animation": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@3.1.0/lib/three-vrm-animation.module.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="hud">
    <div id="affection">
      <span class="heart">♥</span>
      <div class="bar"><div class="fill" id="affection-fill"></div></div>
      <span id="affection-label">Незнакомец</span>
    </div>
    <div id="buttons">
      <button id="btn-voice" class="icon-btn" title="Озвучка"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
      <button id="btn-camera" class="icon-btn" title="Режим камеры: вращать и приближать"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="12.5" height="10" rx="2.5"/><path d="M15.5 11l5-3v8l-5-3"/></svg></button>
      <button id="btn-wardrobe" class="icon-btn" title="Гардероб"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7.5a2 2 0 1 1 2-2"/><path d="M12 7.5v1.2L3.5 14.5a1.2 1.2 0 0 0 .7 2.2h15.6a1.2 1.2 0 0 0 .7-2.2L12 8.7"/></svg></button>
      <button id="btn-anims" class="icon-btn" title="Анимации и танец"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17.5V6l10-2v11.5"/><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="15.5" r="2.5"/></svg></button>
      <button id="btn-editor" class="icon-btn" title="Редактор поз"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4.5L15.5 5a2 2 0 0 1 2.8 0l.7.7a2 2 0 0 1 0 2.8L8.5 19z"/><path d="M13.5 7l3.5 3.5"/></svg></button>
      <button id="btn-hitbox" class="icon-btn" title="Показать зоны касаний"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.8"/></svg></button>
    </div>
  </div>

  <div id="bubble" class="hidden"></div>

  <div id="toast"></div>

  <div id="poses">
    <div id="pose-list" hidden></div>
    <div id="pose-bar" hidden>
      <div id="pose-bar-buttons">
        <button id="pose-reset">Сброс</button>
        <button id="pose-clear">Удалить мои</button>
        <button id="pose-save">Сохранить</button>
        <button id="pose-done" class="primary">Готово</button>
      </div>
      <form id="pose-save-form" hidden>
        <input id="pose-save-name" type="text" maxlength="20" placeholder="Название позы" autocomplete="off" />
        <button type="submit" class="primary">OK</button>
        <button type="button" id="pose-save-cancel">✕</button>
      </form>
    </div>
    <div id="cam-controls" hidden>
      <button id="btn-zoom" class="icon-btn" title="Во весь рост / крупно"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/></svg></button>
      <button id="cam-out" class="icon-btn" title="Отдалить"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
      <button id="cam-in" class="icon-btn" title="Приблизить"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="cam-left" class="icon-btn" title="Повернуть влево"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4 4.5v4h4"/></svg></button>
      <button id="cam-right" class="icon-btn" title="Повернуть вправо"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M20 4.5v4h-4"/></svg></button>
      <button id="cam-reset" class="icon-btn" title="Вернуть вид"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-6.5 8 6.5"/><path d="M6.5 9.5V19h11V9.5"/></svg></button>
    </div>
    <button id="poses-toggle" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2"/><path d="M12 8v6M12 14l-3 6M12 14l3 6M7 10.5l5-1.5 5 1.5"/></svg><span>Поза: <b id="pose-current">Стоит</b></span><span class="chev">▴</span></button>
  </div>

  <div id="wardrobe" class="panel hidden">
    <div class="editor-head">
      <b>Гардероб</b>
      <button class="panel-close" title="Закрыть">✕</button>
    </div>
    <div class="panel-body">
      <button id="goth-preset" class="panel-big">🖤 Готик-образ одной кнопкой</button>
      <div class="editor-group">Наряды</div>
      <div id="outfit-list"></div>
      <label class="panel-add">+ Добавить наряд (.vrm)
        <input id="outfit-input" type="file" accept=".vrm" hidden />
      </label>
      <p class="panel-note">Сделай в VRoid Studio ту же девушку в разных нарядах и добавь каждый файл сюда.</p>
      <div class="editor-group">Цвет одежды</div>
      <div id="color-list"></div>
      <div class="editor-group">Волосы</div>
      <div id="hair-list" class="swatches"></div>
      <div class="editor-group">Чулки</div>
      <div id="stocking-list" class="chips"></div>
      <div class="editor-group">Атмосфера</div>
      <button id="dark-toggle" class="panel-big">🌙 Готичная атмосфера: выкл</button>
    </div>
  </div>

  <div id="anims" class="panel hidden">
    <div class="editor-head">
      <b>Анимации</b>
      <button class="panel-close" title="Закрыть">✕</button>
    </div>
    <div class="panel-body">
      <button id="btn-dance" class="panel-big">💃 Танцевать</button>
      <div class="editor-group">Mocap-анимации</div>
      <div id="anim-list"></div>
      <label class="panel-add">+ Загрузить анимацию (.vrma или .fbx Mixamo)
        <input id="anim-input" type="file" accept=".vrma,.fbx" hidden />
      </label>
    </div>
  </div>

  <div id="hint">Гладь по голове, бери за руку… просто попробуй 😉</div>

  <div id="loading">
    <div class="spinner"></div>
    <div id="loading-text">Загрузка…</div>
  </div>

  <div id="flash"></div>
  <div id="drop-overlay" class="hidden">Отпусти файл: .vrm — новый наряд, .vrma/.fbx — анимация</div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
